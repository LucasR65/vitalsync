name: VitalSync CI/CD Pipeline
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:

  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installation des dépendances
        working-directory: backend
        run: npm ci

      - name: Lint ESLint
        working-directory: backend
        run: npm run lint

      - name: Tests unitaires Jest
        working-directory: backend
        run: npm test

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test  

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Login sur Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/vitalsync-backend:latest

      - name: Build & Push image frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/vitalsync-frontend:latest

  deploy-staging:
    name: Deploy Staging & Health Check
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Créer le fichier .env pour le staging
        run: |
          echo "POSTGRES_DB=vitalsync" >> .env
          echo "POSTGRES_USER=vitalsync_user" >> .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "NODE_ENV=production" >> .env
          echo "DB_HOST=database" >> .env
          echo "DB_PORT=5432" >> .env

      - name: Démarrer les services avec Docker Compose
        run: docker compose up -d --build

      - name: Attendre le démarrage des services (15s)
        run: sleep 15

      - name: Health Check du backend
        run: |
          echo "Vérification de l'endpoint /health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERREUR : Le health check a échoué (HTTP $STATUS)"
            docker compose logs backend
            exit 1
          fi
          echo "Health check OK - Backend opérationnel"

      - name: Arrêter les services
        if: always()
        run: docker compose down